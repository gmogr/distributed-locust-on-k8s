apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-master
spec:
  selector:
    matchLabels:
      app: locust-master
  template:
    metadata:
      labels:
        app: locust-master
    spec:
      containers:
      - name: master
        image: locustio/locust
        command: ["/bin/sh", "-c"]
        args:
          - |
            if [ -f /home/locust/requirements.txt ]; then
              pip install --no-cache-dir -r /home/locust/requirements.txt
            fi
            exec locust --master
        volumeMounts:
        - name: locustfile
          mountPath: /home/locust
      volumes:
      - name: locustfile
        configMap:
          name: locustfile
---
apiVersion: v1
kind: Service
metadata:
  name: locust-master
spec:
  ports:
  - name: main-bind
    port: 5557
  - name: main-comm
    port: 5558
  - name: web-ui
    port: 8089
  selector:
    app: locust-master
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: locust-worker
  template:
    metadata:
      labels:
        app: locust-worker
    spec:
      containers:
      - name: worker
        image: locustio/locust
        command: ["/bin/sh", "-c"]
        args:
          - |
            if [ -f /home/locust/requirements.txt ]; then
              pip install --no-cache-dir -r /home/locust/requirements.txt
            fi
            exec locust --worker --master-host=locust-master
        volumeMounts:
        - name: locustfile
          mountPath: /home/locust
      volumes:
      - name: locustfile
        configMap:
          name: locustfile
